# =============================================================================
# optimize.conf — конфигурация optimize-standalone.sh
# Расположение: рядом со скриптом (optimize-standalone.sh читает его автоматически)
# =============================================================================

# ─── SSH ─────────────────────────────────────────────────────────────────────
SSH_PORT=22

# ─── Публичный ключ ───────────────────────────────────────────────────────────
# Вставь содержимое ~/.ssh/id_rsa.pub или id_ed25519.pub
PUB_KEY="ssh-ed25519 AAAA... user@host"

# ─── Cloudflare API токен (опционально) ──────────────────────────────────────
# Если задан — домен определяется автоматически по IP сервера через CF API.
# Если не задан — скрипт спросит домен вручную.
# Права токена: Zone → DNS → Read, Zone → Zone → Read
BEARER=""
