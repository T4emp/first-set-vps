# =============================================================================
# tguard.conf — конфигурация tguard
# Расположение: /root/tguard/tguard.conf
# =============================================================================

# ─── SSH ─────────────────────────────────────────────────────────────────────
# Порт SSH. Может быть нестандартным.
# Abuse обрабатывает fail2ban — connlimit на SSH не ставится.
SSH_PORT=22

# ─── Remnaware ───────────────────────────────────────────────────────────────
# IP-адрес сервера управления (remnaware). Только этот IP получит доступ к REMNAWARE_PORT.
REMNAWARE_IP=0.0.0.0/32

# Порт, по которому remnaware общается с нодой (основной канал управления).
REMNAWARE_PORT=2000

# ─── Пользовательские порты ──────────────────────────────────────────────────
# Порты для подключения пользователей. 443 уже открыт в core.
# Перечисли через запятую без пробелов.
# Пример: 9443,8443,8080
USER_PORTS=
