# urls.conf — автоматически скачиваемые провайдеры
#
# Формат: имя|url
#   имя  — будет сохранено как providers/имя.list
#   url  — ссылка на список IP/CIDR
#
# Поддерживаемые форматы ответа:
#   - JSON объект с полем "prefixes": {"prefixes": ["1.2.3.4/24", ...]}
#   - JSON массив:                    ["1.2.3.4/24", ...]
#   - Plain text, один CIDR на строку
#
# Обновление: ./tguard.sh update-providers
# (также запускается автоматически через cron раз в месяц)
#
# Пример:
#	yandex_cdn|https://tech.cdn.yandex.net/prefixes/yc.json
#	cloudflare|https://www.cloudflare.com/ips-v4/#
